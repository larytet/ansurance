# ansurance, on-prem profile. Run from the repo root:  make up
name: ansurance

x-api-env: &api-env
  ANS_PROFILE: ${ANS_PROFILE:-onprem}
  ANS_DATABASE_URL: postgresql+psycopg://ansurance:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ansurance
  ANS_S3_ENDPOINT: http://objectstore:9000
  ANS_S3_BUCKET_ORIGINALS: originals
  ANS_S3_ACCESS_KEY: ${OBJECTSTORE_APP_USER:-ansurance-app}
  ANS_S3_SECRET_KEY: ${OBJECTSTORE_APP_PASSWORD:?set OBJECTSTORE_APP_PASSWORD in .env}
  ANS_S3_REGION: us-east-1
  ANS_CLAMD_HOST: clamav
  ANS_LOG_LEVEL: ${ANS_LOG_LEVEL:-INFO}

services:
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # Bind to the VPN-facing address only (set BIND_ADDR in .env). Default: loopback.
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDR:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

  web:
    build:
      context: ../../web
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    environment: *api-env
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed-processes &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
      objectstore-init: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/ready').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    # Same image as the API. Runs the job queue: the intake pipeline (virus scan, OCR,
    # classify, attribute, file) and the fax drop-folder poller.
    build:
      context: ../../backend
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    environment:
      <<: *api-env
      ANS_FAX_DIR: /fax
      ANS_OCR_LANGS: ${ANS_OCR_LANGS:-heb+ara+rus+fra+eng}
    command: ["python", "-m", "app.jobs.worker"]
    volumes:
      - faxdrop:/fax
    depends_on:
      api: { condition: service_healthy }

  # ---- optional: docker compose --profile observability up -d ----------------------------
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      api: { condition: service_healthy }

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ../observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml:ro
      - ../observability/dashboard.json:/var/lib/grafana/dashboards/ansurance.json:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  walarchive-init:
    # The archive directory must be writable by the database user (uid 70).
    image: postgres:16-alpine
    restart: "no"
    user: root
    entrypoint: ["sh", "-c", "chown postgres:postgres /wal && chmod 700 /wal"]
    volumes:
      - ${BACKUP_WAL_PATH:-walarchive}:/wal

  backup:
    # Nightly encrypted backup (database dump and every original), monthly restore self-test.
    # Point BACKUP_PATH at a directory on a different disk, and keep BACKUP_PASSPHRASE somewhere
    # safe: without it a backup cannot be read.
    build: ../backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ansurance
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ansurance
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: ${OBJECTSTORE_APP_USER:-ansurance-app}
      S3_SECRET_KEY: ${OBJECTSTORE_APP_PASSWORD:?set OBJECTSTORE_APP_PASSWORD in .env}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ${BACKUP_PATH:-backups}:/backups
      - ${BACKUP_WAL_PATH:-walarchive}:/wal
    depends_on:
      api: { condition: service_healthy }

  postgres:
    build: ../postgres
    restart: unless-stopped
    # Continuous archiving of the write-ahead log (encrypted, every 5 minutes at most) gives
    # point-in-time recovery with an RPO of minutes; the backup service takes the base backups.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - "archive_command=test ! -f /wal/%f.enc && openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in %p -out /wal/%f.enc.tmp && mv /wal/%f.enc.tmp /wal/%f.enc"
    environment:
      POSTGRES_USER: ansurance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ansurance
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${BACKUP_WAL_PATH:-walarchive}:/wal
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    depends_on:
      walarchive-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansurance -d ansurance"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    # MinIO built from source (deploy/objectstore/Dockerfile). The M2 spike confirms the
    # choice behind the BlobStore interface (DESIGN section 7).
    build: ../objectstore
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECTSTORE_USER:-ansurance}
      MINIO_ROOT_PASSWORD: ${OBJECTSTORE_PASSWORD:?set OBJECTSTORE_PASSWORD in .env}
    volumes:
      - objdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore-init:
    # One-shot: buckets (originals with Object Lock), and the application user that can
    # read and write but never delete.
    build: ../objectstore
    restart: "no"
    entrypoint: ["/opt/objectstore/init.sh"]
    environment:
      ENDPOINT: http://objectstore:9000
      MINIO_ROOT_USER: ${OBJECTSTORE_USER:-ansurance}
      MINIO_ROOT_PASSWORD: ${OBJECTSTORE_PASSWORD:?set OBJECTSTORE_PASSWORD in .env}
      APP_USER: ${OBJECTSTORE_APP_USER:-ansurance-app}
      APP_PASSWORD: ${OBJECTSTORE_APP_PASSWORD:?set OBJECTSTORE_APP_PASSWORD in .env}
      LOCK_DAYS: ${ORIGINALS_LOCK_DAYS:-2555}
    depends_on:
      objectstore: { condition: service_healthy }

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  promdata:
  grafanadata:
  walarchive:
  backups:
  faxdrop:
  clamdata:
  caddy_data:
  pgdata:
  objdata:
