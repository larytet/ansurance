# Same rules as the stock PostgreSQL image (trust on this container's own loopback, passwords
# from the Docker network), plus replication connections from the backup container so it can
# take base backups. The database is never published outside the Docker network.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
