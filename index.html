<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ansurance - Inbox mock</title>
<meta name="description" content="Clickable mock of the ansurance CRM Inbox for a small Israeli insurance agency. Fictional data.">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#14202b;--muted:#5c6b7a;--line:#dde2e8;
  --accent:#1f6feb;--accent-soft:#dbe8fd;--red:#d1313f;--red-soft:#fbe3e5;--amber:#b7791f;--amber-soft:#fbefd5;
  --green:#1a7f4b;--green-soft:#dcf2e6;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b8;--line:#2a3745;
    --accent:#5aa2ff;--accent-soft:#1d3552;--red:#ff6b78;--red-soft:#3a1f25;--amber:#e3b04b;--amber-soft:#3a2f17;
    --green:#4cc38a;--green-soft:#173a2a;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b8;--line:#2a3745;
  --accent:#5aa2ff;--accent-soft:#1d3552;--red:#ff6b78;--red-soft:#3a1f25;--amber:#e3b04b;--amber-soft:#3a2f17;
  --green:#4cc38a;--green-soft:#173a2a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font-weight:700;font-size:18px;letter-spacing:.2px}
.logo span{color:var(--accent)}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line);background:var(--panel)}
nav.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px;max-width:1280px;margin:0 auto}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip b{margin-inline-start:6px;color:var(--muted);font-weight:600}
.summary{font-weight:600;margin-bottom:8px}
.summary .u{color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.strip{position:relative;display:flex;gap:1px;height:34px;padding:6px;margin-bottom:8px;touch-action:none;user-select:none}
.strip .bar{flex:1;min-width:2px;border-radius:1px;background:var(--line);align-self:stretch}
.strip .bar.r{background:var(--red)}.strip .bar.a{background:var(--amber)}
.lens{position:absolute;top:2px;bottom:2px;border:2px solid var(--accent);background:var(--accent-soft);opacity:.55;border-radius:4px;cursor:grab}
.lens:active{cursor:grabbing}
.lensinfo{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:0 4px 8px}
.list{padding:8px;outline:none}
.row{display:block;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;border-inline-start:5px solid var(--line)}
.row.r{border-inline-start-color:var(--red)}.row.a{border-inline-start-color:var(--amber)}
.row[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.row .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .cl{font-weight:600}
.row .age{margin-inline-start:auto;color:var(--muted);font-size:12px}
.row .d{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{display:block;width:100%;height:5px;margin:1px 0;padding:0;border:0;border-radius:2px;background:var(--line)}
.sq.r{background:var(--red)}.sq.a{background:var(--amber)}
.sq:hover{filter:brightness(1.2);height:7px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.r{background:var(--red-soft);color:var(--red)}.badge.a{background:var(--amber-soft);color:var(--amber)}
.detail{padding:16px;position:sticky;top:120px}
.detail h2{margin:0 0 4px;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.doc{border:1px dashed var(--line);border-radius:8px;padding:10px;margin:10px 0}
.doc i{display:block;height:6px;background:var(--line);border-radius:3px;margin:6px 0}
.doc i:nth-child(2){width:80%}.doc i:nth-child(3){width:90%}.doc i:nth-child(4){width:55%}
.conf{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.conf>div{height:100%;background:var(--green)}
.msg{border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--bg);border:1px solid var(--line)}
.msg small{display:block;color:var(--muted);margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty.ok{color:var(--green);font-weight:600}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
.audit{padding:14px}
.audit table{width:100%;border-collapse:collapse;font-size:13px}
.audit td,.audit th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.audit code{font-size:12px;color:var(--muted)}
.audit tr.bad td{background:var(--red-soft)}
.tour-ring{position:fixed;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;z-index:50;transition:all .35s}
.tour-tip{position:fixed;z-index:51;max-width:300px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px}
.tour-tip small{display:block;color:var(--muted);margin-top:4px}
footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>

/* ---------- render ---------- */
function applyChrome(){
  var h=document.documentElement;h.lang=S.lang;h.dir=RTL[S.lang]?"rtl":"ltr";
  if(S.theme)h.setAttribute("data-theme",S.theme);else h.removeAttribute("data-theme");
  var dark=S.theme?S.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  $("themeBtn").textContent=dark?"☀ "+t("theme_l"):"☾ "+t("theme_d");
  $("tourBtn").textContent="▶ "+t("tour");
  $("langSel").value=S.lang;
  document.title="ansurance - "+t("tab_inbox");
  var rs=$("roleSel");rs.innerHTML="";
  ROLES.forEach(function(r){var b=document.createElement("button");b.textContent=roleName(r);b.setAttribute("aria-pressed",String(r===S.role));b.onclick=function(){S.role=r;S.filter="all";S.sel=null;S.lens=0;store("role",r);render()};rs.appendChild(b)});
  var tb=$("tabs");tb.innerHTML="";
  [["inbox",t("tab_inbox")],["trust",t("tab_trust")]].forEach(function(x){var b=document.createElement("button");b.setAttribute("role","tab");b.setAttribute("aria-selected",String(S.tab===x[0]));b.textContent=x[1];b.onclick=function(){S.tab=x[0];render()};tb.appendChild(b)});
  $("foot").textContent=t("foot");
}
function render(){applyChrome();S.tab==="inbox"?renderInbox():renderTrust()}

function renderInbox(){
  var all=S.items[S.role],vis=visible(),urgent=all.filter(function(i){return i.urg===2}).length;
  S.lens=Math.max(0,Math.min(S.lens,Math.max(0,vis.length-LENS)));
  var counts={};all.forEach(function(i){counts[i.type]=(counts[i.type]||0)+1});
  var chips='<button class="chip" data-f="all" aria-pressed="'+(S.filter==="all")+'">'+t("all")+'<b>'+all.length+'</b></button>';
  Object.keys(TYPES).filter(function(k){return TYPES[k].r===S.role&&counts[k]}).forEach(function(k){
    chips+='<button class="chip" data-f="'+k+'" aria-pressed="'+(S.filter===k)+'">'+t("ty_"+k)+'<b>'+counts[k]+'</b></button>'});
  var h='<p class="note">'+esc(t("foot"))+'</p><div class="toolbar" id="chips">'+chips+'</div>';
  h+='<div class="summary">'+t("sum",{n:all.length,a:'\u0001',d:S.done[S.role]}).replace("\u0001",'<span class="u">'+urgent+'</span>')+'</div>';
  h+='<div class="grid"><div class="card"><div class="strip" id="strip" tabindex="0" aria-label="Lens">';
  vis.forEach(function(i){h+='<div class="bar '+uc(i.urg)+'"></div>'});
  h+='<div class="lens" id="lens"></div></div><div class="lensinfo"><span id="win"></span><span>'+esc(t("lenshint"))+'</span></div><div class="list" id="list" tabindex="0">';
  if(!vis.length)h+='<div class="empty ok">✓ '+esc(t("empty"))+'</div>';
  h+='</div></div><div class="card detail" id="detail"></div></div>';
  $("main").innerHTML=h;
  $("chips").onclick=function(e){var b=e.target.closest("button");if(!b)return;S.filter=b.dataset.f;S.sel=null;S.lens=0;renderInbox()};
  drawList();drawDetail();bindLens();
}
function drawList(){
  var vis=visible(),list=$("list");if(!list)return;
  var keep=list.querySelector(".empty");list.innerHTML="";if(keep)list.appendChild(keep);
  vis.forEach(function(it,idx){
    var inLens=idx>=S.lens&&idx<S.lens+LENS,b=document.createElement("button");
    if(inLens){
      b.className="row "+uc(it.urg);b.setAttribute("aria-current",String(S.sel===it.id));
      b.innerHTML='<div class="t"><span class="badge '+uc(it.urg)+'">'+esc(t("ty_"+it.type))+'</span><span class="cl">'+esc(it.client)+'</span><span class="age">'+esc(age(it.mins))+'</span></div><div class="d">'+esc(t("d_"+it.type,{n:it.n}))+'</div>';
      b.onclick=function(){S.sel=it.id;drawList();drawDetail()};
    }else{
      b.className="sq "+uc(it.urg);b.title=it.client+" - "+t("ty_"+it.type);b.setAttribute("aria-label",b.title);
      b.onclick=function(){S.lens=Math.max(0,Math.min(vis.length-LENS,idx-Math.floor(LENS/2)));drawList();syncLens()};
    }
    list.appendChild(b);
  });
  syncLens();
}
function syncLens(){
  var vis=visible(),n=vis.length,lens=$("lens");if(!lens)return;
  var w=n?Math.min(1,LENS/n):1,l=n?S.lens/n:0;
  lens.style.insetInlineStart=(l*100)+"%";lens.style.width=(w*100)+"%";
  $("win").textContent=n?t("win",{a:S.lens+1,b:Math.min(n,S.lens+LENS),n:n}):"";
  lens.parentNode.style.display=n?"flex":"none";
}
function bindLens(){
  var strip=$("strip"),list=$("list");if(!strip)return;
  var drag=false;
  function pos(e){
    var n=visible().length,r=strip.getBoundingClientRect(),x=e.clientX-r.left,f=RTL[S.lang]?1-x/r.width:x/r.width;
    S.lens=Math.max(0,Math.min(n-LENS,Math.round(f*n-LENS/2)));drawList();
  }
  strip.onpointerdown=function(e){drag=true;strip.setPointerCapture(e.pointerId);pos(e)};
  strip.onpointermove=function(e){if(drag)pos(e)};
  strip.onpointerup=function(){drag=false};
  function move(d){var n=visible().length;S.lens=Math.max(0,Math.min(Math.max(0,n-LENS),S.lens+d));drawList()}
  function key(e){
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){move(1);e.preventDefault()}
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){move(-1);e.preventDefault()}
    else if(e.key==="PageDown"){move(LENS);e.preventDefault()}
    else if(e.key==="PageUp"){move(-LENS);e.preventDefault()}
  }
  strip.onkeydown=key;list.onkeydown=key;
  list.onwheel=function(e){if(visible().length>LENS){e.preventDefault();move(e.deltaY>0?1:-1)}};
}
function findSel(){var a=S.items[S.role];for(var i=0;i<a.length;i++)if(a[i].id===S.sel)return a[i];return null}
function drawDetail(){
  var d=$("detail"),it=findSel();if(!d)return;
  if(!it){d.innerHTML='<div class="empty">'+esc(t("pick"))+'</div>';return}
  var T=TYPES[it.type],h='<span class="badge '+uc(it.urg)+'">'+esc(t("ty_"+it.type))+'</span><h2>'+esc(it.client)+'</h2><div>'+esc(t("d_"+it.type,{n:it.n}))+'</div>';
  h+='<dl class="kv"><dt>'+t("idn")+'</dt><dd dir="ltr">'+it.idn+'</dd><dt>'+t("channel")+'</dt><dd>'+esc(t("ch_"+it.ch))+'</dd><dt>'+t("age")+'</dt><dd>'+esc(age(it.mins))+'</dd><dt>'+t("urg")+'</dt><dd>'+esc(t("u"+it.urg))+'</dd></dl>';
  if(T.intake){
    var pct=Math.round(it.conf*100);
    h+='<div class="doc" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div>'+esc(t("match"))+': <b>'+pct+'%</b></div><div class="conf"><div style="width:'+pct+'%;background:'+(pct>=95?"var(--green)":pct>=50?"var(--amber)":"var(--red)")+'"></div></div>';
    if(it.type==="review")h+='<p class="note" style="margin-top:8px">'+esc(it.client)+' / '+esc(it.alt)+'</p>';
  }
  if(it.msg){
    var m=it.msg,tr=m.tr[S.lang];
    h+='<div class="msg"><small>'+esc(t("orig"))+' ('+m.from+')</small><span dir="auto">'+esc(m.orig)+'</span></div>';
    if(m.from!==S.lang&&tr)h+='<div class="msg"><small>'+esc(t("trans"))+'</small><span>'+esc(tr)+'</span></div>';
  }
  var act={reply:"a_reply",callback:"a_call",campaign:"a_reply",renewal:"a_call",filed:"a_review",review:"a_review",unassigned:"a_assign",submit:"a_send",approval:"a_approve",campaign2:"a_approve",complaint:"a_open",compliance:"a_open",misfile:"a_open",leak:"a_open",unsigned:"a_confirm"}[it.type]||"a_open";
  var others=ROLES.filter(function(r){return r!==S.role});
  h+='<div class="actions"><button class="btn primary" id="go">'+esc(t(act))+'</button>';
  others.forEach(function(r){h+='<button class="btn" data-r="'+r+'">'+esc(t("reassign",{r:roleName(r)}))+'</button>'});
  h+='</div><div class="actions"><select id="why" aria-label="'+esc(t("reason"))+'"><option value="">'+esc(t("reason"))+'…</option><option>'+esc(t("r1"))+'</option><option>'+esc(t("r2"))+'</option><option>'+esc(t("r3"))+'</option></select><button class="btn" id="dis" disabled>'+esc(t("dismiss"))+'</button></div>';
  d.innerHTML=h;
  $("go").onclick=function(){removeSel(it);S.done[S.role]++;logAudit(roleName(S.role),t("done",{a:t("ty_"+it.type)})+" / "+it.client);toast("✓ "+t("done",{a:t("ty_"+it.type)}))};
  d.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){var r=b.dataset.r;removeSel(it);it.role=r;S.items[r].unshift(it);logAudit(roleName(S.role),t("reassigned",{r:roleName(r)})+" / "+it.client);toast(t("reassigned",{r:roleName(r)}))}});
  $("why").onchange=function(){$("dis").disabled=!$("why").value};
  $("dis").onclick=function(){removeSel(it);logAudit(roleName(S.role),t("dismissed")+" ("+$("why").value+") / "+it.client);toast(t("dismissed"))};
}
function removeSel(it){
  var a=S.items[S.role],i=a.indexOf(it);if(i>=0)a.splice(i,1);S.sel=null;renderInbox();
}

function renderTrust(){
  var rows="";S.audit.forEach(function(e,i){rows+='<tr class="'+(S.verdict&&S.verdict.bad===i?"bad":"")+'"><td>'+(i+1)+'</td><td>'+esc(e.who)+'</td><td>'+esc(e.text)+'</td><td>'+esc(e.when)+'</td><td><code>'+e.hash+'</code></td></tr>'});
  var v=S.verdict?'<p><b>'+esc(S.verdict.bad>=0?t("bad",{n:S.verdict.bad+1}):t("ok",{n:S.audit.length}))+'</b></p>':"";
  $("main").innerHTML='<p class="note">'+esc(t("trusthint"))+'</p><div class="card audit"><div class="actions" style="margin:0 0 10px"><button class="btn primary" id="ver">'+esc(t("verify"))+'</button><button class="btn" id="tam">'+esc(t("tamper"))+'</button><button class="btn" id="res">'+esc(t("restore"))+'</button></div>'+v+'<table><thead><tr><th>#</th><th>'+t("who")+'</th><th>'+t("what")+'</th><th>'+t("when")+'</th><th>'+t("hash")+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  $("ver").onclick=function(){
    var prev="genesis",bad=-1;
    S.audit.forEach(function(e,i){if(bad>=0)return;var h=fnv(prev+e.who+e.text+e.when);if(h!==e.hash)bad=i;prev=e.hash});
    S.verdict={bad:bad};renderTrust();
  };
  $("tam").onclick=function(){if(S.audit.length>1){S.audit[1].text+=" (edited)";S.verdict=null;renderTrust()}};
  $("res").onclick=function(){S.audit.forEach(function(e){e.text=e.orig});S.verdict=null;renderTrust()};
}

/* ---------- Show me tour ---------- */
function stopTour(){
  if(!S.tour)return;clearInterval(S.tour.h);["tourRing","tourTip"].forEach(function(i){var e=$(i);if(e)e.remove()});S.tour=null;
}
function startTour(){
  stopTour();S.tab="inbox";render();
  var steps=[["roleSel","t1"],["langSel","t2"],["themeBtn","t3"],["chips","t4"],["strip","t5"],["list","t6"]],i=0;
  var ring=document.createElement("div");ring.className="tour-ring";ring.id="tourRing";
  var tip=document.createElement("div");tip.className="tour-tip";tip.id="tourTip";
  document.body.appendChild(ring);document.body.appendChild(tip);
  function show(){
    var s=steps[i],el=$(s[0]);if(!el){next();return}
    el.scrollIntoView({block:"center",behavior:"smooth"});
    setTimeout(function(){
      if(!S.tour)return;var r=el.getBoundingClientRect();
      ring.style.cssText="left:"+(r.left-6)+"px;top:"+(r.top-6)+"px;width:"+(r.width+12)+"px;height:"+(r.height+12)+"px";
      tip.innerHTML=esc(t(s[1]))+'<small>'+(i+1)+'/'+steps.length+' · '+esc(t("t_stop"))+'</small>';
      var top=r.bottom+14;if(top+110>innerHeight)top=Math.max(8,r.top-110);
      var left=Math.max(8,Math.min(innerWidth-310,r.left));
      tip.style.top=top+"px";tip.style.left=left+"px";
    },380);
  }
  function next(){i++;if(i>=steps.length){stopTour();return}show()}
  S.tour={h:setInterval(next,4200)};show();
}

/* ---------- boot ---------- */
(function(){
  var l=load("lang");if(l&&I[l])S.lang=l;else{var n=(navigator.language||"en").slice(0,2);if(I[n])S.lang=n}
  var th=load("theme");if(th==="light"||th==="dark")S.theme=th;
  var r=load("role");if(r&&ROLES.indexOf(r)>=0)S.role=r;
  logAudit("System","Nightly backup stored encrypted");
  logAudit("Manager","Login with two-factor authentication");
  logAudit("Back-office","Fax intake: 14 documents filed, 2 sent to review");
  $("langSel").onchange=function(){S.lang=this.value;store("lang",S.lang);render()};
  $("themeBtn").onclick=function(){
    var dark=S.theme?S.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
    S.theme=dark?"light":"dark";store("theme",S.theme);render();
  };
  $("tourBtn").onclick=startTour;
  document.addEventListener("keydown",function(e){if(e.key==="Escape")stopTour()});
  document.addEventListener("pointerdown",function(e){if(S.tour&&!e.target.closest("#tourTip"))stopTour()},true);
  render();
})();
</script>
</body>
