<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ansurance - Inbox mock</title>
<meta name="description" content="Clickable mock of the ansurance CRM Inbox for a small Israeli insurance agency. Fictional data.">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#14202b;--muted:#5c6b7a;--line:#dde2e8;
  --accent:#1f6feb;--accent-soft:#dbe8fd;--red:#d1313f;--red-soft:#fbe3e5;--amber:#b7791f;--amber-soft:#fbefd5;
  --green:#1a7f4b;--green-soft:#dcf2e6;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b8;--line:#2a3745;
    --accent:#5aa2ff;--accent-soft:#1d3552;--red:#ff6b78;--red-soft:#3a1f25;--amber:#e3b04b;--amber-soft:#3a2f17;
    --green:#4cc38a;--green-soft:#173a2a;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b8;--line:#2a3745;
  --accent:#5aa2ff;--accent-soft:#1d3552;--red:#ff6b78;--red-soft:#3a1f25;--amber:#e3b04b;--amber-soft:#3a2f17;
  --green:#4cc38a;--green-soft:#173a2a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font-weight:700;font-size:18px;letter-spacing:.2px}
.logo span{color:var(--accent)}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line);background:var(--panel)}
nav.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px;max-width:1500px;margin:0 auto}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip b{margin-inline-start:6px;color:var(--muted);font-weight:600}
.summary{font-weight:600;margin-bottom:8px}
.summary .u{color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.strip{position:relative;display:flex;gap:1px;height:34px;padding:6px;margin-bottom:8px;touch-action:none;user-select:none}
.strip .bar{flex:1;min-width:2px;border-radius:1px;background:var(--line);align-self:stretch}
.strip .bar.r{background:var(--red)}.strip .bar.a{background:var(--amber)}
.lens{position:absolute;top:2px;bottom:2px;border:2px solid var(--accent);background:var(--accent-soft);opacity:.55;border-radius:4px;cursor:grab}
.lens:active{cursor:grabbing}
.lensinfo{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:0 4px 8px}
.list{padding:8px;outline:none}
.row{display:block;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;border-inline-start:5px solid var(--line)}
.row.r{border-inline-start-color:var(--red)}.row.a{border-inline-start-color:var(--amber)}
.row[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.row .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .cl{font-weight:600}
.row .age{margin-inline-start:auto;color:var(--muted);font-size:12px}
.row .d{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{display:block;width:100%;height:5px;margin:1px 0;padding:0;border:0;border-radius:2px;background:var(--line)}
.sq.r{background:var(--red)}.sq.a{background:var(--amber)}
.sq:hover{filter:brightness(1.2);height:7px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.r{background:var(--red-soft);color:var(--red)}.badge.a{background:var(--amber-soft);color:var(--amber)}
.detail{padding:16px;position:sticky;top:120px}
.detail h2{margin:0 0 4px;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.doc{border:1px dashed var(--line);border-radius:8px;padding:10px;margin:10px 0}
.doc i{display:block;height:6px;background:var(--line);border-radius:3px;margin:6px 0}
.doc i:nth-child(2){width:80%}.doc i:nth-child(3){width:90%}.doc i:nth-child(4){width:55%}
.conf{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.conf>div{height:100%;background:var(--green)}
.msg{border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--bg);border:1px solid var(--line)}
.msg small{display:block;color:var(--muted);margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty.ok{color:var(--green);font-weight:600}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
.audit{padding:14px}
.audit table{width:100%;border-collapse:collapse;font-size:13px}
.audit td,.audit th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.audit code{font-size:12px;color:var(--muted)}
.audit tr.bad td{background:var(--red-soft)}
.tour-ring{position:fixed;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;z-index:50;transition:all .35s}
.tour-tip{position:fixed;z-index:51;max-width:300px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px}
.tour-tip small{display:block;color:var(--muted);margin-top:4px}
footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}

nav.tabs{overflow-x:auto;white-space:nowrap}
.sim{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.icard{padding:14px}.icard .d{color:var(--muted);font-size:13px;margin:2px 0}.icard .st{color:var(--green);font-size:13px;margin-top:6px}.icard .res{margin-top:6px;font-size:13px;background:var(--green-soft);border-radius:8px;padding:6px 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
.step{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.tick{color:var(--green);font-weight:700}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.bub small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.bub.in{align-self:flex-start}.bub.out{align-self:flex-end;background:var(--green-soft);border-color:var(--green)}.bub.ad{background:var(--amber-soft);border-color:var(--amber)}
.alert{background:var(--red-soft);border:1px solid var(--red);color:var(--ink);border-radius:8px;padding:8px 10px;margin:8px 0}
.subs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.sub{padding:8px 12px;border-radius:10px;border:1px solid var(--line);max-width:90%}
.sub.agent{align-self:flex-start;background:var(--accent-soft)}.sub.client{align-self:flex-end;background:var(--bg)}
.sub .txt{font-size:17px}.sub small{color:var(--muted);display:block}.flag{color:var(--amber);font-weight:600}
input,label{font:inherit}
input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}

.pk-strip{margin-top:6px}.strip .bar.s{background:var(--accent)}
.prow{display:flex;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px;background:var(--panel);cursor:pointer}
.prow:hover{border-color:var(--accent)}.prow .pn{flex:1}.prow .pid{color:var(--muted);font-size:12px}
.scroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.scroll .tbl th{position:sticky;top:0;background:var(--panel)}

body.narrow main{max-width:860px}body.narrow .grid{grid-template-columns:1fr}
body.compact{font-size:14px}body.compact main{padding:10px}
body.compact .row{padding:4px 10px;margin-bottom:3px}body.compact .row .d{font-size:12px}
body.compact .prow{padding:3px 8px;margin-bottom:2px}body.compact .tbl th,body.compact .tbl td{padding:3px 8px}
body.compact .card.detail,body.compact .icard{padding:10px}
.pl{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-size:11px;font-weight:600}

.fld{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}.fld input,.fld select{color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:16px;line-height:1.9;font-size:14px;margin:8px 0;box-shadow:var(--shadow)}
.fv{background:#dcf2e6;color:#111;border-radius:3px;padding:0 3px}.fm{background:#fbe3e5;color:#b3202e;border-radius:3px;padding:0 3px;font-weight:600}
.idcard{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:10px;background:linear-gradient(135deg,var(--accent-soft),var(--panel));margin:8px 0}.idcard .ph{width:56px;height:70px;border-radius:6px;background:var(--line)}
.labels{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}.lab{border:1px dashed #777;padding:8px;font-size:12px;border-radius:4px;background:#fff;color:#111}.lab .lf{font-size:10px;color:#555;border-bottom:1px solid #ddd;padding-bottom:3px;margin-bottom:5px}.lab .lt{font-size:14px;line-height:1.4}.lbar{height:18px;margin-top:6px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px)}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}}
.chk{display:flex;gap:6px;align-items:center;margin:4px 0}
.phone{width:340px;max-width:100%;height:640px;border:10px solid #222;border-radius:34px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden;margin:0 auto;box-shadow:var(--shadow)}
.ptop{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel)}.pback{border:0;background:none;font-size:22px}
.pbody{flex:1;overflow:auto;padding:12px}.pc{text-align:center}.plogo{font-weight:800;font-size:26px;color:var(--accent)}
.phead{margin-bottom:8px}.pbd{background:var(--amber-soft);border-radius:8px;padding:6px 8px;margin-top:6px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.pcard .big{font-size:24px;font-weight:700}.pcard .d{color:var(--muted);font-size:12px}
.pbars{display:flex;gap:6px;height:60px;align-items:flex-end;margin-top:8px}.pbars i{flex:1;background:linear-gradient(var(--accent),var(--accent-soft));border-radius:4px 4px 0 0}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.ptiles div{border:1px solid var(--line);border-radius:10px;padding:8px}.ptiles span{display:block;font-size:11px;color:var(--muted)}
.pnav{display:flex;border-top:1px solid var(--line)}.pnav button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px}.pnav button span{display:block;font-size:18px}.pnav button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.sheet{border:1px solid var(--accent);border-radius:12px;padding:12px;background:var(--panel)}

.ptab{font-weight:700;color:var(--ink)!important;background:var(--accent-soft)!important;border-radius:8px 8px 0 0}
.pintro{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:12px}.pintro p{margin:6px 0}
.rtag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--rc);color:var(--rc);font-weight:600;margin-inline-start:6px}
.pipe{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:10px 4px;margin:6px 0}
.pcol{display:flex;flex-direction:column;gap:6px;justify-content:center}.pcol.par{border:1px dashed var(--muted);border-radius:10px;padding:4px}
.pcl{font-size:11px;color:var(--muted);text-align:center}
.parr{font-size:26px;color:var(--muted);line-height:1}html[dir=rtl] .parr{transform:scaleX(-1)}
.pst{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:150px;text-align:start;background:var(--panel);border:2px solid var(--rc);border-radius:10px;padding:6px 10px;position:relative}
.pst .xpn,.stgh .xpn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rc);color:#fff;font-size:12px;font-weight:700;flex:none}
.pst .pnm{font-weight:600;font-size:13px}.pst .pm{font-size:11px;color:var(--muted)}
.pst.locked{opacity:.55;border-style:dashed}.pst.done{background:var(--green-soft)}.pst.ready{box-shadow:0 0 0 3px var(--amber-soft)}.pst.open{box-shadow:0 0 0 3px var(--accent-soft)}
.pipe.mini{padding:2px}.pipe.mini .pst{min-width:0;padding:3px;border-width:2px;border-radius:50%}.pipe.mini .parr{font-size:16px}.pipe.mini .pcol.par{padding:2px;gap:3px}
.pbanner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:2px solid var(--rc);border-inline-start-width:8px;border-radius:12px;background:var(--panel);padding:8px 12px;margin-bottom:12px}
.pbt{background:var(--rc);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}.pbm{flex:1;min-width:120px;overflow:hidden}
.stgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:10px}
.stg{background:var(--panel);border:1px solid var(--line);border-inline-start:6px solid var(--rc);border-radius:12px;padding:10px 12px}
.stg.locked{opacity:.6}.stg.done{background:var(--green-soft)}.stg.ready{outline:2px solid var(--amber)}
.stgh{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.spill{margin-inline-start:auto;font-size:12px;background:var(--accent-soft);border-radius:999px;padding:1px 10px}
.par2{font-size:12px;color:var(--muted)}
ul.xchk{list-style:none;margin:8px 0;padding:0}.chh{font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;margin-top:8px}
.ck{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:start;background:transparent;border:0;padding:4px 2px}.ck:disabled{cursor:default}
.cb{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-size:14px;line-height:1}.ck.on .cb{background:var(--green);border-color:var(--green);color:#fff}.ck.on .ct{color:var(--muted)}
.ki{flex:none;color:var(--muted);width:16px}.stgf{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--green)}.pbar.sm{height:6px}
.pdone{background:var(--green-soft);border:2px solid var(--green);border-radius:10px;padding:10px;font-weight:700;margin:8px 0}
.xprow{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px;border-inline-start:6px solid var(--rc)}
.pcat{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}.xpc{padding:12px;border-inline-start:6px solid var(--rc);position:relative}
.xpc.feat{grid-column:1/-1;border:2px solid var(--rc);border-inline-start-width:8px;background:var(--accent-soft)}.pfeat{position:absolute;inset-block-start:-11px;inset-inline-start:14px;background:var(--rc);color:#fff;border-radius:999px;padding:1px 12px;font-size:12px;font-weight:700}
a.btn{text-decoration:none;display:inline-block}
</style>

  h+='<div class="summary">'+t("sum",{n:all.length,a:'\u0001',d:S.done[S.role]}).replace("\u0001",'<span class="u">'+urgent+'</span>')+'</div>';

  if(!vis.length)h+=S.q?'<div class="empty">'+esc(t("pk_none"))+'</div>':'<div class="empty ok">✓ '+esc(t("empty"))+'</div>';
  h+='</div></div><div class="card detail" id="detail"></div></div>';

  $("chips").onclick=function(e){var b=e.target.closest("button");if(!b)return;S.filter=b.dataset.f;S.sel=null;S.lens=0;renderInbox()};

}
function drawList(){
  var vis=visible(),list=$("list");if(!list)return;
  var keep=list.querySelector(".empty");list.innerHTML="";if(keep)list.appendChild(keep);
  vis.forEach(function(it,idx){
    var inLens=idx>=S.lens&&idx<S.lens+LENS,b=document.createElement("button");
    if(inLens){
      b.className="row "+uc(it.urg);b.setAttribute("aria-current",String(S.sel===it.id));
      b.innerHTML='<div class="t"><span class="badge '+uc(it.urg)+'">'+esc(t("ty_"+it.type))+'</span><span class="cl" dir="auto">'+esc(nm(it.client))+'</span><span class="age">'+esc(age(it.mins))+'</span></div><div class="d">'+esc(t("d_"+it.type,{n:it.n}))+'</div>';
      b.onclick=function(){S.sel=it.id;drawList();drawDetail()};
    }else{
      b.className="sq "+uc(it.urg);b.title=nm(it.client)+" - "+t("ty_"+it.type);b.setAttribute("aria-label",b.title);
      b.onclick=function(){S.lens=Math.max(0,Math.min(vis.length-LENS,idx-Math.floor(LENS/2)));drawList();syncLens()};
    }
    list.appendChild(b);
  });
  syncLens();
}
function syncLens(){
  var vis=visible(),n=vis.length,lens=$("lens");if(!lens)return;
  var w=n?Math.min(1,LENS/n):1,l=n?S.lens/n:0;
  lens.style.insetInlineStart=(l*100)+"%";lens.style.width=(w*100)+"%";
  $("win").textContent=n?t("win",{a:S.lens+1,b:Math.min(n,S.lens+LENS),n:n}):"";
  lens.parentNode.style.display=n?"flex":"none";
}
function bindLens(){
  var strip=$("strip"),list=$("list");if(!strip)return;
  var drag=false;
  function pos(e){
    var n=visible().length,r=strip.getBoundingClientRect(),x=e.clientX-r.left,f=RTL[S.lang]?1-x/r.width:x/r.width;
    S.lens=Math.max(0,Math.min(n-LENS,Math.round(f*n-LENS/2)));drawList();
  }
  strip.onpointerdown=function(e){drag=true;strip.setPointerCapture(e.pointerId);pos(e)};
  strip.onpointermove=function(e){if(drag)pos(e)};
  strip.onpointerup=function(){drag=false};
  function move(d){var n=visible().length;S.lens=Math.max(0,Math.min(Math.max(0,n-LENS),S.lens+d));drawList()}
  function key(e){
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){move(1);e.preventDefault()}
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){move(-1);e.preventDefault()}
    else if(e.key==="PageDown"){move(LENS);e.preventDefault()}
    else if(e.key==="PageUp"){move(-LENS);e.preventDefault()}
  }
  strip.onkeydown=key;list.onkeydown=key;
  list.onwheel=function(e){if(visible().length>LENS){e.preventDefault();move(e.deltaY>0?1:-1)}};
}
function findSel(){var a=S.items[S.role];for(var i=0;i<a.length;i++)if(a[i].id===S.sel)return a[i];return null}
function drawDetail(){

    h+='<div class="msg"><small>'+esc(t("orig"))+' ('+m.from+')</small><span dir="auto">'+esc(m.orig)+'</span></div>';
    if(m.from!==S.lang&&tr)h+='<div class="msg"><small>'+esc(t("trans"))+'</small><span>'+esc(tr)+'</span></div>';
  }
  var act={reply:"a_reply",callback:"a_call",campaign:"a_reply",renewal:"a_call",filed:"a_review",review:"a_review",unassigned:"a_assign",submit:"a_send",approval:"a_approve",campaign2:"a_approve",complaint:"a_open",compliance:"a_open",misfile:"a_open",leak:"a_open",unsigned:"a_confirm"}[it.type]||"a_open";
  var others=ROLES.filter(function(r){return r!==S.role});
  h+='<div class="actions"><button class="btn primary" id="go">'+esc(t(act))+'</button>'+(JUMP[it.type]?'<button class="btn" id="jump">'+esc(t("a_openarea"))+'</button>':"");
  others.forEach(function(r){h+='<button class="btn" data-r="'+r+'">'+esc(t("reassign",{r:roleName(r)}))+'</button>'});
  h+='</div><div class="actions"><select id="why" aria-label="'+esc(t("reason"))+'"><option value="">'+esc(t("reason"))+'…</option><option>'+esc(t("r1"))+'</option><option>'+esc(t("r2"))+'</option><option>'+esc(t("r3"))+'</option></select><button class="btn" id="dis" disabled>'+esc(t("dismiss"))+'</button></div>';
  d.innerHTML=h;
  if($("jump"))$("jump").onclick=function(){var j=JUMP[it.type];S.tab=j[0];if(j[0]==="desk")S.desk.sec=j[1];else S.mk.sec=j[1];render()};
  $("go").onclick=function(){removeSel(it);S.done[S.role]++;logAudit(roleName(S.role),t("done",{a:t("ty_"+it.type)})+" / "+nm(it.client));toast("✓ "+t("done",{a:t("ty_"+it.type)}))};
  d.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){var r=b.dataset.r;removeSel(it);it.role=r;S.items[r].unshift(it);logAudit(roleName(S.role),t("reassigned",{r:roleName(r)})+" / "+nm(it.client));toast(t("reassigned",{r:roleName(r)}))}});
  $("why").onchange=function(){$("dis").disabled=!$("why").value};
  $("dis").onclick=function(){removeSel(it);logAudit(roleName(S.role),t("dismissed")+" ("+$("why").value+") / "+it.client);toast(t("dismissed"))};
}
function removeSel(it){
  var a=S.items[S.role],i=a.indexOf(it);if(i>=0)a.splice(i,1);S.sel=null;renderInbox();
}

function renderTrust(){
  var rows="";S.audit.forEach(function(e,i){rows+='<tr class="'+(S.verdict&&S.verdict.bad===i?"bad":"")+'"><td>'+(i+1)+'</td><td>'+esc(e.who)+'</td><td>'+esc(e.text)+'</td><td>'+esc(fmtTime(e.ts,true))+'</td><td><code>'+e.hash+'</code></td></tr>'});
  var v=S.verdict?'<p><b>'+esc(S.verdict.bad>=0?t("bad",{n:S.verdict.bad+1}):t("ok",{n:S.audit.length}))+'</b></p>':"";
  $("main").innerHTML='<p class="note">'+esc(t("trusthint"))+'</p><div class="card audit"><div class="actions" style="margin:0 0 10px"><button class="btn primary" id="ver">'+esc(t("verify"))+'</button><button class="btn" id="tam">'+esc(t("tamper"))+'</button><button class="btn" id="res">'+esc(t("restore"))+'</button></div>'+v+'<table><thead><tr><th>#</th><th>'+t("who")+'</th><th>'+t("what")+'</th><th>'+t("when")+'</th><th>'+t("hash")+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  $("ver").onclick=function(){
    var prev="genesis",bad=-1;
    S.audit.forEach(function(e,i){if(bad>=0)return;var h=fnv(prev+e.who+e.text+e.ts);if(h!==e.hash)bad=i;prev=e.hash});
    S.verdict={bad:bad};renderTrust();
  };
  $("tam").onclick=function(){if(S.audit.length>1){S.audit[1].text+=" (edited)";S.verdict=null;renderTrust()}};
  $("res").onclick=function(){S.audit.forEach(function(e){e.text=e.orig});S.verdict=null;renderTrust()};
}

var PK_WIN=8;

  q=fold((q||"").trim());if(!q)return true;var tr=TR[n]||{};

  return q.split(/\s+/).every(function(tok){return hay.indexOf(tok)>=0});
}
function makePicker(box,cfg){

  var q=box.querySelector(".pk-q"),strip=box.querySelector(".pk-strip"),list=box.querySelector(".pk-list"),bAll=box.querySelector("[data-k=all]"),bClr=box.querySelector("[data-k=clr]");if(cfg.single){bAll.style.display="none";bClr.style.display="none"}
  function flt(){return cfg.all.filter(function(n){return matchClient(n,P.q)})}

  var drag=false;

  strip.onpointerdown=function(e){drag=true;strip.setPointerCapture(e.pointerId);pos(e)};
  strip.onpointermove=function(e){if(drag)pos(e)};strip.onpointerup=function(){drag=false};
  function move(d){var n=flt().length;P.lens=Math.max(0,Math.min(Math.max(0,n-win),P.lens+d));draw()}
  function key(e){
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){move(1);e.preventDefault()}
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){move(-1);e.preventDefault()}

  }
  strip.onkeydown=key;list.onkeydown=key;

var XF=null;

function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++)d[i]=[i];for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function xlFiles(){

  });

}
S.xj={q:"",res:null};
function xjRun(q){
  var F=xlFiles(),qq=q.trim(),dig=/^\d{2,9}$/.test(qq),nq=norm(qq),res={q:qq,rows:[],direct:{}};
  var A=qq?F.A.filter(function(r){return matchClient(r.name,qq)}):[];
  res.direct.A=A.length;
  res.direct.B=qq?F.B.filter(function(r){return dig?r.last4.indexOf(qq)>=0:(nq&&norm(r.cust).indexOf(nq)>=0)}).length:0;
  res.direct.C=qq?F.C.filter(function(r){return dig&&r.id.indexOf(qq)>=0}).length:0;
  A.forEach(function(a){
    var ln=norm(latin(a.name)),cand=F.B.filter(function(b){return b.last4===a.id.slice(-4)}),best=null,bd=99;
    cand.forEach(function(b){var d=lev(norm(b.cust),ln);if(d<bd){bd=d;best=b}});
    var jq=!best?"none":bd===0?"exact":bd<=2?"similar":"last4",c=F.C.filter(function(r){return r.id===a.id})[0];
    res.rows.push({name:a.name,id:a.id,pol:best?best.pol:null,comm:best?best.comm:null,bal:c?c.bal:null,jq:jq,files:"A"+(best?"+B":"")+(c?"+C":"")});
  });
  return res;
}

function startTour(){
  stopTour();S.tab="inbox";render();

  var ring=document.createElement("div");ring.className="tour-ring";ring.id="tourRing";
  var tip=document.createElement("div");tip.className="tour-tip";tip.id="tourTip";
  document.body.appendChild(ring);document.body.appendChild(tip);
  function show(){
    var s=steps[i],el=$(s[0]);if(!el){next();return}
    el.scrollIntoView({block:"center",behavior:"smooth"});
    setTimeout(function(){
      if(!S.tour)return;var r=el.getBoundingClientRect();
      ring.style.cssText="left:"+(r.left-6)+"px;top:"+(r.top-6)+"px;width:"+(r.width+12)+"px;height:"+(r.height+12)+"px";
      tip.innerHTML=esc(t(s[1]))+'<small>'+(i+1)+'/'+steps.length+' · '+esc(t("t_stop"))+'</small>';
      var top=r.bottom+14;if(top+110>innerHeight)top=Math.max(8,r.top-110);

    out.push({f:f,ins:ins,no:String(1000000+Math.floor(r()*8999999)),bal:bal,prem:sav?0:150+Math.floor(r()*750),
      dep:sav&&f!=="invest"?{emp:Math.round(600+r()*1500),ee:Math.round(300+r()*800),sev:Math.round(500+r()*1100)}:null,
      feeD:+(0.4+r()*3.4).toFixed(2),feeB:+(0.05+r()*0.7).toFixed(2),ytd:+(2+r()*7).toFixed(1),avg:+(3+r()*5).toFixed(1),
      proj:sav?Math.round(bal*(1.6+r()))+0:0,pens:sav?Math.round(bal*(1.6+r())/190):0,
      cov:f==="pension"||f==="exec"||f==="life"||f==="health"?[["pd_c1",Math.round(300+r()*900)*1000],["pd_c2",Math.round(6+r()*14)*1000],["pd_c3",Math.round(3+r()*7)*1000],["pd_c4",1]].slice(0,2+Math.floor(r()*3)):[],

function saveSheet(key,c){
  var S0=SHEETS[key],v={},miss=[],box=$("flSheet");

  S0.f.forEach(function(f){if(f[3]&&!v[f[0]])miss.push(t(f[1]))});

  var d=fdata(c);
  if(key==="client"){if(!idValid(v.idn)){toast(t("sf_badid"));return false}NAMES.push(v.name);CLANG[v.name]="he";IDS[v.name]=v.idn;S.prof[v.name]=Object.assign(prof(v.name),{phone:v.phone||""});S.file.client=v.name}
  else if(key==="lead")d.leads.unshift({type:v.type,interest:v.interest,st:v.st||"ld_s1"});
  else if(key==="employer")d.emp.unshift({employer:v.name,type:"em_emp",salary:0,from:dstr(0)});
  else if(key==="act")d.acts.unshift({k:v.k.replace("ty_",""),txt:v.txt,date:dstr(0),dur:0});
  else if(key==="task")S.today.tasks.unshift({id:"k"+Date.now(),txt:v.txt,client:c,due:Math.round((new Date(v.date)-new Date(dstr(0)))/DAYMS),done:false,deleg:false});
  else if(key==="mtg")d.mtg.unshift({type:v.type,date:v.date,subject:v.subject});
  else if(key==="sum")d.sum.unshift({title:v.title,date:dstr(0)});
  else if(key==="wf")d.wf.unshift({type:v.type,handler:v.handler||AGENT.name,st:"wf_s1"});
  else if(key==="rep")d.rep.unshift({period:t(v.period),date:dstr(0)});
  else if(key==="emp")d.emp.unshift({employer:v.employer,type:v.type,salary:+v.salary||0,from:dstr(0)});
  else if(key==="rel")d.rel.push({name:v.name,rel:v.rel});
  logAudit(who(),t("sh_"+key)+" / "+c);toast("✓ "+t("sf_ok"));return true;

function pStage(p,id){for(var i=0;i<p.st.length;i++)if(p.st[i][0]===id)return p.st[i]}
function pChecks(st){var r=[];st[4].forEach(function(c,i){if(c.charAt(0)!=="#")r.push(i)});return r}
function pLevels(p){var L={};p.st.forEach(function(s,i){var d=pDeps(p,i);L[s[0]]=d.length?1+Math.max.apply(null,d.map(function(x){return L[x]})):0});return L}
function pCols(p){var L=pLevels(p),cols=[];p.st.forEach(function(s,i){(cols[L[s[0]]]=cols[L[s[0]]]||[]).push(i)});return cols}
function pCount(p){var n=0;p.st.forEach(function(s){n+=pChecks(s).length});return n}
function isPar(p,i){var c=pCols(p),L=pLevels(p)[p.st[i][0]];return c[L].length>1||(pDeps(p,i).length===0&&i>0)}
function iStat(I2,s){
  var p=PM[I2.p];if(I2.fin[s[0]])return"done";
  var idx=p.st.indexOf(s),dp=pDeps(p,idx);
  if(dp.some(function(x){return !I2.fin[x]}))return"locked";
  return pChecks(s).every(function(k){return I2.done[s[0]+":"+k]})?"ready":"open";
}
function iTicks(I2,s){return pChecks(s).filter(function(k){return I2.done[s[0]+":"+k]}).length}
function iPct(I2){var p=PM[I2.p];return Math.round(100*p.st.filter(function(s){return I2.fin[s[0]]}).length/p.st.length)}

}

    psw:function(v){S.role=v;store("role",v);S.tab="proc";render()},
    pfoc:function(v){var e=$("stg_"+v);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:"smooth",block:"center"})},
    pcopy:function(v){var c=pMermaid(PM[v],pLang());try{navigator.clipboard.writeText(c)}catch(e){}toast(t("pr_copied"))},
    pdl:function(v){var a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(pMermaid(PM[v],pLang()));a.download=v+".mmd";a.click()}
  };
  function cur(){return P.list.filter(function(x){return x.id===P.sel})[0]}
  if(P.view==="run"&&P.sel&&cur()){
    var I2=cur(),p=PM[I2.p],pc=iPct(I2);
    h+='<div class="toolbar">'+ab("pbk",t("pr_back"))+diagBtns(p)+'</div>';
    h+=procHead(p)+'<div class="pbar"><i style="width:'+pc+'%"></i></div><div class="summary">'+esc(nm(I2.client))+' · '+esc(t("pr_pct",{n:pc}))+'</div>';
    if(iComplete(I2))h+='<div class="pdone">✓ '+esc(t("pr_complete"))+'</div>';
    h+=pipeHtml(p,I2,false)+'<div class="stgs">'+p.st.map(function(s,i){return stageCard(p,i,I2)}).join("")+'</div>';
  }else if(P.view==="work"){
    var rows=[];P.list.forEach(function(I2){if(iComplete(I2))return;PM[I2.p].st.forEach(function(s){if(s[2]===S.role){var q=iStat(I2,s);if(q==="open"||q==="ready")rows.push([I2,s,q])}})});
    h+='<div class="summary">'+esc(t("pr_work"))+' · '+esc(roleName(S.role))+' ('+rows.length+')</div>';
    h+=rows.length?rows.map(function(r){var I2=r[0],s=r[1],p=PM[I2.p];return '<div class="card xprow" style="--rc:'+RCOL[s[2]]+'"><div><b>'+esc(PT(s[1]))+'</b> <span class="note" style="margin:0">'+esc(PT(p.n))+' · <span dir="auto">'+esc(nm(I2.client))+'</span></span><div class="pbar sm"><i style="width:'+iPct(I2)+'%"></i></div></div><span class="spill">'+esc(r[2]==="ready"?t("pr_ready"):t("pr_inprog",{a:iTicks(I2,s),b:pChecks(s).length}))+'</span>'+ab("popen",t("pr_open"),"primary",false,I2.id)+'</div>'}).join(""):'<div class="empty">'+esc(t("pr_none"))+'</div>';
  }else if(P.view==="run"){
    h+=P.list.length?P.list.map(function(I2){var p=PM[I2.p],pc=iPct(I2);return '<div class="card xprow" style="--rc:'+RCOL[p.o]+'"><div style="flex:1;min-width:0"><b>'+esc(PT(p.n))+'</b> <span dir="auto">'+esc(nm(I2.client))+'</span><div class="pbar sm"><i style="width:'+pc+'%"></i></div>'+pipeHtml(p,I2,true)+'</div><span class="spill">'+(iComplete(I2)?"✓ "+esc(t("pr_done")):pc+"%")+'</span>'+ab("popen",t("pr_open"),"primary",false,I2.id)+'</div>'}).reverse().join(""):'<div class="empty">'+esc(t("pr_run_none"))+'</div>';
  }else{
    h+='<div class="toolbar"><span>'+esc(t("pr_client"))+'</span>'+nmSel("pcl",P.client)+'</div><div class="pcat">';
    var order=PROCS.slice().sort(function(a,b){return(b.id==="retire")-(a.id==="retire")});
    order.forEach(function(p){
      h+='<div class="card xpc'+(p.id==="retire"?" feat":"")+'" style="--rc:'+RCOL[p.o]+'">'+(p.id==="retire"?'<span class="pfeat">★ '+esc(t("pr_feat"))+'</span>':"")+procHead(p)+pipeHtml(p,null,true)+'<div class="toolbar" style="margin:8px 0 0">'+ab("pstart",t("pr_start"),"primary",false,p.id)+ab("pdet",P.cat===p.id?t("pr_hide"):t("pr_details"),"",false,p.id)+diagBtns(p)+'</div>'+(P.cat===p.id?pipeHtml(p,null,false)+'<div class="stgs">'+p.st.map(function(s,i){return stageCard(p,i,null)}).join("")+'</div>':"")+'</div>'});
    h+='</div>';
  }
  B.innerHTML=h;bind(B,map);
  var c=$("pcl");if(c)c.onchange=function(){P.client=this.value};
}
function updTab(){var b=document.querySelector('nav.tabs [data-tab="proc"]');if(b)b.textContent=t("tab_proc")+" ("+pMyCount()+")"}

/* ---- process banner on other screens ---- */
function bannerFor(){
  var tb=S.tab,m=null;
  if(tb==="desk")m={id:"idreg",tpl:"tpl",out:"post",req:"insreq",tax:"tax"}[S.desk.sec];
  else if(tb==="file")m="onb";
  else if(tb==="pension")m="retire";
  else if(tb==="intake"||tb==="wa")m="intake";
  else if(tb==="mkt")m="camp";
  else if(tb==="clients")m="onb";
  else if(tb==="excel")m="comm";
  return m?PM[m]:null;
}
function addBanner(){
  var p=bannerFor(),mn=$("main");if(!p||!mn)return;
  var d=document.createElement("div");d.className="pbanner";d.style.setProperty("--rc",RCOL[p.o]);
  d.innerHTML='<span class="pbt">'+esc(t("pr_banner"))+'</span><b>'+esc(PT(p.n))+'</b><span class="pbm">'+pipeHtml(p,null,true)+'</span>'+ab("pbgo",t("pr_gopr"),"primary")+'<a class="btn" target="_blank" rel="noopener" href="'+esc(pLink(p,pLang()))+'">'+esc(t("pr_diagram"))+'</a>';
  mn.insertBefore(d,mn.firstChild);
  d.querySelector('[data-a="pbgo"]').onclick=function(){S.pr.view="cat";S.pr.cat=p.id;S.tab="proc";render()};
}
(function seed(){
  var N=NAMES;
  pSeed("retire",N[0],{int:"fin",auth:"fin",ana:3});
  pSeed("insreq",N[3],{rcv:"fin",auth:"fin",prp:1});
  pSeed("sev",N[5],{emp:2,fix:1});
  pSeed("onb",N[2],{id:"fin",kyc:"fin",reg:"fin"});
  pSeed("tax",N[7]||N[1],{cert:"fin",inv:1});
  pSeed("idreg",N[4],{req:"fin",chk:"fin",reg:"fin"});
  S.pr.doneLogged[S.pr.list[S.pr.list.length-1].id]=1;
})();

["renderDesk","renderFile","renderPension","renderIntake","renderWa","renderMkt","renderClients","renderExcel"].forEach(function(n){
  var f=eval(n);eval(n+"=function(){f.apply(this,arguments);addBanner()}");
});

/* ---------- boot ---------- */
(function(){
  var l=load("lang");if(l&&I[l])S.lang=l;
  var th=load("theme");S.theme=th==="dark"?"dark":th==="system"?null:"light";
  var r=load("role");S.role=(r&&ROLES.indexOf(r)>=0)?r:"back";S.tab=HOME[S.role];
  try{var sp=JSON.parse(load("prefs")||"null");if(sp)Object.assign(S.prefs,sp)}catch(e){}
  try{var cp=JSON.parse(load("cp")||"null");if(cp){S.cp=cp;Object.keys(cp).forEach(refreshMsgs)}}catch(e){}
  applyPrefs();
  logAudit("System","Nightly backup stored encrypted");
  logAudit("Manager","Login with two-factor authentication");
  logAudit("Back-office","Fax intake: 14 documents filed, 2 sent to review");
  $("langSel").onchange=function(){S.lang=this.value;store("lang",S.lang);render()};
  $("themeBtn").onclick=function(){
    var dark=S.theme?S.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
    S.theme=dark?"light":"dark";store("theme",S.theme);render();
  };
  $("tourBtn").onclick=startTour;
  document.addEventListener("keydown",function(e){if(e.key==="Escape")stopTour()});
  document.addEventListener("pointerdown",function(e){if(S.tour&&!e.target.closest("#tourTip"))stopTour()},true);
  render();
})();
</script>
