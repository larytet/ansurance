<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ansurance - Inbox mock</title>
<meta name="description" content="Clickable mock of the ansurance CRM Inbox for a small Israeli insurance agency. Fictional data.">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#14202b;--muted:#5c6b7a;--line:#dde2e8;
  --accent:#1f6feb;--accent-soft:#dbe8fd;--red:#d1313f;--red-soft:#fbe3e5;--amber:#b7791f;--amber-soft:#fbefd5;
  --green:#1a7f4b;--green-soft:#dcf2e6;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b8;--line:#2a3745;
    --accent:#5aa2ff;--accent-soft:#1d3552;--red:#ff6b78;--red-soft:#3a1f25;--amber:#e3b04b;--amber-soft:#3a2f17;
    --green:#4cc38a;--green-soft:#173a2a;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b8;--line:#2a3745;
  --accent:#5aa2ff;--accent-soft:#1d3552;--red:#ff6b78;--red-soft:#3a1f25;--amber:#e3b04b;--amber-soft:#3a2f17;
  --green:#4cc38a;--green-soft:#173a2a;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font-weight:700;font-size:18px;letter-spacing:.2px}
.logo span{color:var(--accent)}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select,.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line);background:var(--panel)}
nav.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px;max-width:1280px;margin:0 auto}
.note{color:var(--muted);font-size:13px;margin:0 0 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip b{margin-inline-start:6px;color:var(--muted);font-weight:600}
.summary{font-weight:600;margin-bottom:8px}
.summary .u{color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.strip{position:relative;display:flex;gap:1px;height:34px;padding:6px;margin-bottom:8px;touch-action:none;user-select:none}
.strip .bar{flex:1;min-width:2px;border-radius:1px;background:var(--line);align-self:stretch}
.strip .bar.r{background:var(--red)}.strip .bar.a{background:var(--amber)}
.lens{position:absolute;top:2px;bottom:2px;border:2px solid var(--accent);background:var(--accent-soft);opacity:.55;border-radius:4px;cursor:grab}
.lens:active{cursor:grabbing}
.lensinfo{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:0 4px 8px}
.list{padding:8px;outline:none}
.row{display:block;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;border-inline-start:5px solid var(--line)}
.row.r{border-inline-start-color:var(--red)}.row.a{border-inline-start-color:var(--amber)}
.row[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.row .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .cl{font-weight:600}
.row .age{margin-inline-start:auto;color:var(--muted);font-size:12px}
.row .d{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{display:block;width:100%;height:5px;margin:1px 0;padding:0;border:0;border-radius:2px;background:var(--line)}
.sq.r{background:var(--red)}.sq.a{background:var(--amber)}
.sq:hover{filter:brightness(1.2);height:7px}
.badge{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.r{background:var(--red-soft);color:var(--red)}.badge.a{background:var(--amber-soft);color:var(--amber)}
.detail{padding:16px;position:sticky;top:120px}
.detail h2{margin:0 0 4px;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.doc{border:1px dashed var(--line);border-radius:8px;padding:10px;margin:10px 0}
.doc i{display:block;height:6px;background:var(--line);border-radius:3px;margin:6px 0}
.doc i:nth-child(2){width:80%}.doc i:nth-child(3){width:90%}.doc i:nth-child(4){width:55%}
.conf{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.conf>div{height:100%;background:var(--green)}
.msg{border-radius:8px;padding:8px 10px;margin:6px 0;background:var(--bg);border:1px solid var(--line)}
.msg small{display:block;color:var(--muted);margin-bottom:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty.ok{color:var(--green);font-weight:600}
.toast{position:fixed;inset-inline:0;bottom:18px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
.audit{padding:14px}
.audit table{width:100%;border-collapse:collapse;font-size:13px}
.audit td,.audit th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.audit code{font-size:12px;color:var(--muted)}
.audit tr.bad td{background:var(--red-soft)}
.tour-ring{position:fixed;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;z-index:50;transition:all .35s}
.tour-tip{position:fixed;z-index:51;max-width:300px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px}
.tour-tip small{display:block;color:var(--muted);margin-top:4px}
footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}

nav.tabs{overflow-x:auto;white-space:nowrap}
.sim{display:inline-block;background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.icard{padding:14px}.icard .d{color:var(--muted);font-size:13px;margin:2px 0}.icard .st{color:var(--green);font-size:13px;margin-top:6px}.icard .res{margin-top:6px;font-size:13px;background:var(--green-soft);border-radius:8px;padding:6px 8px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
.step{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.tick{color:var(--green);font-weight:700}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{max-width:85%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.bub small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.bub.in{align-self:flex-start}.bub.out{align-self:flex-end;background:var(--green-soft);border-color:var(--green)}.bub.ad{background:var(--amber-soft);border-color:var(--amber)}
.alert{background:var(--red-soft);border:1px solid var(--red);color:var(--ink);border-radius:8px;padding:8px 10px;margin:8px 0}
.subs{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.sub{padding:8px 12px;border-radius:10px;border:1px solid var(--line);max-width:90%}
.sub.agent{align-self:flex-start;background:var(--accent-soft)}.sub.client{align-self:flex-end;background:var(--bg)}
.sub .txt{font-size:17px}.sub small{color:var(--muted);display:block}.flag{color:var(--amber);font-weight:600}
input,label{font:inherit}
input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
</style>
</head>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function idNum(r){var d=[];for(var i=0;i<8;i++)d.push(Math.floor(r()*10));var s=0;for(i=0;i<8;i++){var x=d[i]*(i%2?2:1);s+=x>9?x-9:x}d.push((10-s%10)%10);return d.join("")}
function gen(role,seed){
  var r=rng(seed),keys=Object.keys(TYPES).filter(function(k){return TYPES[k].r===role}),pool=[];
  keys.forEach(function(k){for(var i=0;i<TYPES[k].w;i++)pool.push(k)});
  var out=[];
  for(var i=0;i<COUNT[role];i++){
    var ty=pool[Math.floor(r()*pool.length)],T=TYPES[ty];
    var mins=Math.floor(5+r()*r()*3000),n=ty==="renewal"?Math.floor(2+r()*50):ty==="compliance"?Math.floor(2+r()*40):ty==="leak"||ty==="campaign2"?Math.floor(3+r()*60):ty==="claimgap"?2+Math.floor(r()*3):Math.floor(1+r()*9);
    var cl=NAMES[Math.floor(r()*NAMES.length)];
    if(!IDS[cl])IDS[cl]=idNum(rng(fnv(cl).split("").reduce(function(a,c){return a*31+c.charCodeAt(0)|0},7)));
    var mine=MSGS.filter(function(m){return m.from===CLANG[cl]});
    out.push({id:role+i,type:ty,role:role,client:cl,idn:IDS[cl],mins:mins,n:n,
      ch:T.ch,conf:T.intake?(ty==="filed"?0.96+r()*0.04:ty==="review"?0.6+r()*0.25:0.1+r()*0.3):null,
      msg:ty==="reply"||ty==="campaign"||ty==="callback"?mine[Math.floor(r()*mine.length)]:null,
      alt:NAMES[Math.floor(r()*NAMES.length)],urg:T.urg(n,mins)});
  }
  out.sort(function(a,b){return b.urg-a.urg||a.mins-b.mins});
  return out;
}

function drawList(){

function syncLens(){
  var vis=visible(),n=vis.length,lens=$("lens");if(!lens)return;
  var w=n?Math.min(1,LENS/n):1,l=n?S.lens/n:0;
  lens.style.insetInlineStart=(l*100)+"%";lens.style.width=(w*100)+"%";
  $("win").textContent=n?t("win",{a:S.lens+1,b:Math.min(n,S.lens+LENS),n:n}):"";
  lens.parentNode.style.display=n?"flex":"none";
}
function bindLens(){
  var strip=$("strip"),list=$("list");if(!strip)return;
  var drag=false;
  function pos(e){
    var n=visible().length,r=strip.getBoundingClientRect(),x=e.clientX-r.left,f=RTL[S.lang]?1-x/r.width:x/r.width;
    S.lens=Math.max(0,Math.min(n-LENS,Math.round(f*n-LENS/2)));drawList();
  }
  strip.onpointerdown=function(e){drag=true;strip.setPointerCapture(e.pointerId);pos(e)};
  strip.onpointermove=function(e){if(drag)pos(e)};
  strip.onpointerup=function(){drag=false};
  function move(d){var n=visible().length;S.lens=Math.max(0,Math.min(Math.max(0,n-LENS),S.lens+d));drawList()}
  function key(e){
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){move(1);e.preventDefault()}
    else if(e.key==="ArrowUp"||e.key==="ArrowLeft"){move(-1);e.preventDefault()}
    else if(e.key==="PageDown"){move(LENS);e.preventDefault()}
    else if(e.key==="PageUp"){move(-LENS);e.preventDefault()}
  }
  strip.onkeydown=key;list.onkeydown=key;
  list.onwheel=function(e){if(visible().length>LENS){e.preventDefault();move(e.deltaY>0?1:-1)}};
}

/* --- Intake pipeline --- */
var INTAKE=[
 {ch:"fx",k:"id",c:"Dana Levi"},{ch:"wa",k:"lic",c:"Omar Khoury"},{ch:"em",k:"pol",c:"Rachel Peretz"},
 {ch:"fx",k:"id",c:"Sophie Benhamou",bad:1},{ch:"em",k:"let",c:null,sur:"Haddad",cand:["Karim Haddad","فاطمة حداد"]}
];
function renderIntake(){
  var it=INTAKE[S.intake.sel],h=sim()+'<p class="note">'+esc(t("in_intro"))+'</p><div class="grid"><div class="card" style="padding:10px">';
  INTAKE.forEach(function(x,i){h+='<button class="row" data-i="'+i+'" aria-current="'+(i===S.intake.sel)+'"><div class="t"><span class="badge">'+esc(t("ch_"+x.ch))+'</span><span class="cl">'+esc(t("in_i"+(i+1)))+'</span></div></button>'});
  h+='<div class="actions"><button class="btn primary" id="inGo"'+(S.intake.busy?" disabled":"")+'>'+esc(t("in_go"))+'</button></div>';
  h+='<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><label>'+esc(t("in_try"))+'<br><input id="idIn" inputmode="numeric" maxlength="9" dir="ltr" placeholder="123456789" style="margin-top:4px"></label> <button class="btn" id="idBtn">'+esc(t("in_check"))+'</button><div id="idOut" class="note" style="margin-top:8px"></div></div>';
  h+='<div class="card detail" id="steps">';
  S.intake.steps.forEach(function(s,i){h+='<div class="step"><span class="tick">✓</span> '+esc(s)+'</div>'});
  if(!S.intake.steps.length)h+='<div class="empty">'+esc(t("pick"))+'</div>';
  h+='</div></div>';
  $("main").innerHTML=h;
  document.querySelectorAll("[data-i]").forEach(function(b){b.onclick=function(){S.intake.sel=+b.dataset.i;S.intake.steps=[];S.intake.busy=false;TOKEN++;renderIntake()}});
  $("inGo").onclick=runIntake;
  $("idBtn").onclick=function(){
    var v=$("idIn").value.trim(),o=$("idOut");
    if(!idValid(v)){o.textContent=t("in_invalid");o.style.color="var(--red)";return}
    var c=byId(v);o.textContent=c?t("in_valid",{c:nm(c)}):t("in_valid_no");o.style.color=c?"var(--green)":"var(--amber)";
  };
  $("idIn").placeholder=clientId("Dana Levi");
}
function runIntake(){
  var x=INTAKE[S.intake.sel],tok=++TOKEN,steps=[],id=null,ocr="",k=t("in_k_"+x.k),route,conf=0,att,ok=null;
  if(x.c){id=clientId(x.c);if(x.bad){id=id.slice(0,3)+((+id[3]+1)%10)+id.slice(4)}}
  steps.push(t("in_s1",{h:fnv(x.ch+x.k+(x.c||x.sur))}));
  steps.push(t("in_s2"));steps.push(t("in_s3",{k:k}));
  if(x.k==="pol"){var pn=polNo(x.c);steps.push(t("in_s4",{f:pn}));att=t("in_a_pol",{c:nm(x.c)});conf=97;route=t("in_r_auto",{c:nm(x.c),p:conf})}
  else if(x.sur){steps.push(t("in_s4",{f:x.sur}));steps.push(t("in_s5",{r:t("in_none")}));att=t("in_a_none",{a:nm(x.cand[0]),b:nm(x.cand[1])});route=t("in_r_rev")}
  else{
    steps.push(t("in_s4",{f:id}));ok=idValid(id);steps.push(t("in_s5",{r:ok?t("in_ok"):t("in_fail")}));
    if(ok){att=t("in_a_id",{c:nm(x.c)});conf=99;route=t("in_r_auto",{c:nm(x.c),p:conf})}
    else{att=t("in_a_bad");route=t("in_r_un")}
  }
  steps.push(t("in_s6",{a:att}));steps.push(t("in_s7",{r:route}));
  S.intake.steps=[];S.intake.busy=true;renderIntake();
  var i=0;(function nxt(){
    if(tok!==TOKEN)return;
    if(i>=steps.length){S.intake.busy=false;logAudit(roleName(S.role),t("au_intake",{a:t("in_i"+(S.intake.sel+1))}));renderIntake();return}
    S.intake.steps.push(steps[i++]);renderIntake();setTimeout(nxt,550);
  })();
}

/* --- Pension: Mislaka / Har HaBituach --- */
var PCLIENTS=["Dana Levi","Omar Khoury","Ирина Волкова","אבי מזרחי","Marie Dubois"];
function pData(name){
  var r=rng(parseInt(fnv(name),16)),prods=["p1","p3"];
  if(r()<0.6)prods.push("p2");prods.push("p4");if(r()<0.5)prods.push("p4");if(r()<0.5)prods.push("p5");if(r()<0.6)prods.push("p6");
  return prods.map(function(p){return {p:p,ins:"ABCDE"[Math.floor(r()*5)],prem:Math.round(150+r()*900),fee:(p==="p4"||p==="p5")?null:+(0.1+r()*1.1).toFixed(2)}});
}
function renderPension(){
  var P=S.pe,h=sim()+'<p class="note">'+esc(t("pe_intro"))+'</p><div class="card" style="padding:14px"><label>'+esc(t("pe_client"))+' <select id="peC">';
  PCLIENTS.forEach(function(c){h+='<option value="'+esc(c)+'"'+(c===P.client?" selected":"")+'>'+esc(nm(c))+'</option>'});
  h+='</select></label><div class="step" style="margin-top:12px">'+(P.signed?'<span class="tick">✓</span> '+esc(t("pe_auth"))+' ('+esc(t("pe_signed"))+')':'<button class="btn" id="peSign">'+esc(t("pe_signreq"))+'</button>')+'</div>';
  h+='<div class="actions"><button class="btn primary" id="peReq">'+esc(t("pe_req"))+'</button></div>';
  if(!P.signed&&!P.sent)h+='<p class="note">'+esc(t("pe_blocked"))+'</p>';
  if(P.sent&&!P.ready)h+='<p class="note">'+esc(t("pe_pending"))+'</p><button class="btn" id="peFf">'+esc(t("pe_ff"))+'</button>';
  if(P.ready){
    var rows=pData(P.client),life=rows.filter(function(r){return r.p==="p4"}).length,flags=[];
    if(life>1)flags.push(t("pe_f_dup"));
    var hi=rows.filter(function(r){return r.fee!==null&&r.fee>0.6})[0];if(hi)flags.push(t("pe_f_fee",{p:t("pe_"+hi.p)}));
    if(!rows.some(function(r){return r.p==="p5"}))flags.push(t("pe_f_gap"));
    h+='<h3 style="margin:14px 0 6px">'+esc(t("pe_res",{d:P.date}))+'</h3><table class="tbl"><thead><tr><th>'+esc(t("pe_ins"))+'</th><th>'+esc(t("pe_prod"))+'</th><th>'+esc(t("pe_prem"))+'</th><th>'+esc(t("pe_fee"))+'</th></tr></thead><tbody>';
    rows.forEach(function(r){h+='<tr><td>'+r.ins+'</td><td>'+esc(t("pe_"+r.p))+'</td><td dir="ltr">₪'+r.prem+'</td><td dir="ltr">'+(r.fee===null?"-":r.fee+"%")+'</td></tr>'});
    h+='</tbody></table><h3 style="margin:14px 0 6px">'+esc(t("pe_flags"))+'</h3>';
    if(flags.length)flags.forEach(function(f){h+='<div class="alert">'+esc(f)+'</div>'});else h+='<div class="note">'+esc(t("pe_none"))+'</div>';
    h+='<div class="actions"><button class="btn primary" id="pePrep">'+esc(t("pe_prep"))+'</button></div><p class="note">'+esc(t("pe_note"))+'</p>';
  }
  h+='</div>';
  $("main").innerHTML=h;
  $("peC").onchange=function(){S.pe={client:this.value,signed:false,sent:false,ready:false,date:""};renderPension()};
  if($("peSign"))$("peSign").onclick=function(){S.pe.signed=true;renderPension()};
  $("peReq").onclick=function(){
    if(!S.pe.signed){toast(t("pe_blocked"));return}
    S.pe.sent=true;logAudit(roleName(S.role),t("au_pe",{c:nm(S.pe.client)}));renderPension();
  };
  if($("peFf"))$("peFf").onclick=function(){S.pe.ready=true;S.pe.date=new Date().toISOString().slice(0,10);renderPension()};
  if($("pePrep"))$("pePrep").onclick=function(){logAudit(roleName(S.role),t("au_pe2",{c:nm(S.pe.client)}));toast("✓ "+t("pe_done"))};
}

/* ---------- Show me tour ---------- */
function stopTour(){
  if(!S.tour)return;clearInterval(S.tour.h);["tourRing","tourTip"].forEach(function(i){var e=$(i);if(e)e.remove()});S.tour=null;
}
function startTour(){
  stopTour();S.tab="inbox";render();
  var steps=[["roleSel","t1"],["tabs","t7"],["langSel","t2"],["themeBtn","t3"],["chips","t4"],["strip","t5"],["list","t6"]],i=0;
  var ring=document.createElement("div");ring.className="tour-ring";ring.id="tourRing";
  var tip=document.createElement("div");tip.className="tour-tip";tip.id="tourTip";
  document.body.appendChild(ring);document.body.appendChild(tip);
  function show(){
    var s=steps[i],el=$(s[0]);if(!el){next();return}
    el.scrollIntoView({block:"center",behavior:"smooth"});
    setTimeout(function(){
      if(!S.tour)return;var r=el.getBoundingClientRect();
      ring.style.cssText="left:"+(r.left-6)+"px;top:"+(r.top-6)+"px;width:"+(r.width+12)+"px;height:"+(r.height+12)+"px";
      tip.innerHTML=esc(t(s[1]))+'<small>'+(i+1)+'/'+steps.length+' · '+esc(t("t_stop"))+'</small>';
      var top=r.bottom+14;if(top+110>innerHeight)top=Math.max(8,r.top-110);
      var left=Math.max(8,Math.min(innerWidth-310,r.left));
      tip.style.top=top+"px";tip.style.left=left+"px";
    },380);
  }
  function next(){i++;if(i>=steps.length){stopTour();return}show()}
  S.tour={h:setInterval(next,4200)};show();
}
