[project]
name = "ansurance-backend"
version = "0.1.0"
description = "ansurance API and worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=25.1.0",
  "pyotp>=2.10.0",
  "authlib>=1.9.5",
  "httpx>=0.27",
  "boto3>=1.43.125",
  "python-multipart>=0.0.33",
  "pypdfium2>=5.15.0",
  "pillow>=13.0.0",
  "numpy>=2.5.4",
  "opencv-python-headless>=5.0.0.93",
  "pyarrow>=26.0.1",
  "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "testcontainers[postgres]>=4.7",
  "pip-audit>=2.7",
  "types-authlib>=1.8.0.20261106",
  "python-bidi>=0.6.12",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20261103",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603", "S607", "S608"]
"app/metrics.py" = ["E501"]  # metric descriptions read better on one line
"app/intake/ocr.py" = ["S603", "S607"]  # runs the local tesseract binary, fixed arguments

[tool.mypy]
strict = true
python_version = "3.12"
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs containers or a long run (real OCR accuracy, Terraform plans, ClamAV)"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "pypdfium2", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
