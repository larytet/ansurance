server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # single-page app: /portal and any other client-side route serve the app shell
    location / {
        try_files $uri /index.html;
    }
    # built assets are content-hashed
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
