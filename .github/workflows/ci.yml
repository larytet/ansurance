name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q -m "not slow"
      - run: uv run pip-audit
  slow:
    # Real OCR accuracy run, Terraform plans (offline), real ClamAV. Longer, so on a schedule
    # and for pull requests into main rather than for every push.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng
      - run: uv sync --frozen
      - run: uv run pytest -q -m slow
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
  stack:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: make smoke
      - run: make conformance
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: always()
        run: make logs | head -200 || true
