name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with: { version: "0.5.31" }
      - run: uv sync --frozen
      - run: uv run python ../scripts/check_pins.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app sandbox
      - run: uv run pytest -q -m "not slow"
      - run: uv run pip-audit
  slow:
    # Real OCR accuracy run, Terraform plans (offline), real ClamAV. Longer, so on a schedule
    # and for pull requests into main rather than for every push.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with: { version: "0.5.31" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb tesseract-ocr-eng
      - run: uv sync --frozen
      - run: uv run pytest -q -m slow
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20.20.0, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
  stack:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make up
      - run: make smoke
      - run: make conformance
      - run: cd web && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: always()
        run: make logs | head -200 || true
