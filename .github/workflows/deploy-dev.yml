name: deploy-dev

# Deploys the current commit to the AWS dev environment, then runs the same black-box
# conformance checks that run against the on-prem stack (profile parity).
#
# One-time setup (see infra/aws/README.md): the Terraform state bucket and lock table, an
# IAM role that GitHub may assume through OIDC, and the repository variables and secrets
# listed below. Nothing here runs until you start it by hand.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (otherwise only plan)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency: deploy-dev

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_DIR: infra/aws

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init, validate, plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ansurance/dev.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
          terraform validate
          terraform plan -input=false -out=dev.tfplan \
            -var-file=dev.tfvars \
            -var "account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -var "certificate_arn=${{ vars.CERTIFICATE_ARN }}" \
            -var "alarm_email=${{ vars.ALARM_EMAIL }}" \
            -var "allowed_cidrs=${{ vars.ALLOWED_CIDRS_JSON }}" \
            -var "image_tag=${{ github.sha }}"

      - name: Create the container repositories first
        if: ${{ inputs.apply }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.r -target=aws_kms_key.main \
            -var-file=dev.tfvars \
            -var "account_id=${{ vars.AWS_ACCOUNT_ID }}" \
            -var "certificate_arn=${{ vars.CERTIFICATE_ARN }}" \
            -var "alarm_email=${{ vars.ALARM_EMAIL }}" \
            -var "allowed_cidrs=${{ vars.ALLOWED_CIDRS_JSON }}"

      - name: Build and push the images
        if: ${{ inputs.apply }}
        run: |
          REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/ansurance/api:${{ github.sha }}" backend
          docker build -t "$REGISTRY/ansurance/web:${{ github.sha }}" web
          docker push "$REGISTRY/ansurance/api:${{ github.sha }}"
          docker push "$REGISTRY/ansurance/web:${{ github.sha }}"

      - name: Terraform apply
        if: ${{ inputs.apply }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve dev.tfplan

      - name: Run the schema migration task before the services take traffic
        if: ${{ inputs.apply }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          TASK=$(terraform output -raw migrate_task_definition)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SGS=$(terraform output -json migrate_security_group_ids | jq -r 'join(",")')
          ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK" --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$ARN"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          [ "$CODE" = "0" ] || { echo "migration failed with exit code $CODE"; exit 1; }

      - name: Wait for the services to be stable
        if: ${{ inputs.apply }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER=$(terraform output -raw cluster_name)
          aws ecs wait services-stable --cluster "$CLUSTER" --services api worker web clamav

      - uses: astral-sh/setup-uv@v3
      - name: Conformance checks against dev (the pre-created conformance manager)
        if: ${{ inputs.apply }}
        working-directory: backend
        env:
          ANS_BASE_URL: https://${{ vars.DEV_HOSTNAME }}
          ANS_CONF_EMAIL: ${{ secrets.CONF_EMAIL }}
          ANS_CONF_PASSWORD: ${{ secrets.CONF_PASSWORD }}
          ANS_CONF_TOTP_SECRET: ${{ secrets.CONF_TOTP_SECRET }}
        run: |
          uv sync --frozen
          uv run python ../scripts/conformance.py
